<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>INTEFIG — All About Email</title>
    <!--
      SPA fallback for static hosts (spa-github-pages pattern): converts a
      deep link like /services into /?/services and bounces to index.html,
      whose restore snippet (in <head>) turns it back into the real path for
      react-router. pathSegmentsToKeep = 0 (site is served from the domain root).
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
